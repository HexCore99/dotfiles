# Native Hyprlock appearance. Colors and dimensions stay together here.
# Hyprlock reads Hyprlang, independently of the bar's QML settings.
$lock_font = Noto Sans
$lock_clock_font = JetBrainsMono Nerd Font
$lock_text = rgb(f1f1f5)
$lock_muted = rgb(999aa7)
$lock_accent = rgb(8ab4ff)
$lock_warning = rgb(d8a080)
$lock_background = rgb(1b1c22)
$lock_card = rgba(1b1c22ed)
$lock_border = rgba(42454499)
$lock_field = rgb(25262e)

# Background brightness is 0..1. Set blur passes to 0 for a sharp wallpaper.
$lock_brightness = 0.55
$lock_blur_passes = 2
$lock_blur_size = 6

# Center offsets: positive Y moves up; negative Y moves down.
$lock_clock_size = 88
$lock_clock_position = 0, 200
$lock_date_size = 18
$lock_date_position = 0, 120
$lock_card_size = 400, 236
$lock_card_position = 0, -92
$lock_card_radius = 28
$lock_icon_size = 22
$lock_icon_position = 0, -4
$lock_user_size = 18
$lock_user_position = 0, -48
$lock_field_size = 328, 54
$lock_field_position = 0, -108
$lock_field_radius = 16
$lock_hint_size = 12
$lock_hint_position = 0, -166
$lock_footer_position = 0, 46
