# Native lock screen used by Super+L, the bar power menu and Hypridle.
# Appearance lives in lockscreen/theme.conf; authentication stays in Hyprlock.
source = ~/.config/hypr/lockscreen/theme.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
}

animations {
    enabled = false
}

# The wallpaper switcher maintains this link after each successful selection.
# Show the wallpaper itself, rather than capturing open application windows.
background {
    monitor =
    path = ~/.config/hypr/wallpaper/current
    color = $lock_background
    blur_passes = $lock_blur_passes
    blur_size = $lock_blur_size
    brightness = $lock_brightness
    contrast = 0.95
    vibrancy = 0.12
    noise = 0.01
}

# A large clock sits above a compact sign-in card.
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    color = $lock_text
    font_size = $lock_clock_size
    font_family = $lock_clock_font
    position = $lock_clock_position
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000066)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $lock_text
    font_size = $lock_date_size
    font_family = $lock_font
    position = $lock_date_position
    halign = center
    valign = center
}

# This card sits behind the icon, account name, input and keyboard hint.
shape {
    monitor =
    size = $lock_card_size
    color = $lock_card
    rounding = $lock_card_radius
    border_size = 1
    border_color = $lock_border
    position = $lock_card_position
    halign = center
    valign = center
    zindex = 0
}

# Rasterized once from the same local SVG used by the bar's Lock tile.
image {
    monitor =
    path = ~/.config/hypr/lockscreen/lock.png
    size = $lock_icon_size
    rounding = 0
    border_size = 0
    position = $lock_icon_position
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = $lock_text
    font_size = $lock_user_size
    font_family = $lock_font
    position = $lock_user_position
    halign = center
    valign = center
    zindex = 1
}

# Enter submits to the existing PAM authentication. Esc/Ctrl+U clear the input.
# Accent colors show checking, failure and Caps Lock without animations.
input-field {
    monitor =
    size = $lock_field_size
    outline_thickness = 2
    outer_color = $lock_border
    inner_color = $lock_field
    font_color = $lock_text
    font_family = $lock_font
    placeholder_text = Enter your password
    check_text = Checking…
    fail_text = $PAMFAIL
    check_color = $lock_accent
    fail_color = $lock_warning
    capslock_color = $lock_warning
    bothlock_color = $lock_warning
    fade_on_empty = false
    rounding = $lock_field_radius
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    position = $lock_field_position
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Enter to unlock  ·  $LAYOUT
    color = $lock_muted
    font_size = $lock_hint_size
    font_family = $lock_font
    position = $lock_hint_position
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = SESSION LOCKED
    color = $lock_text
    font_size = $lock_hint_size
    font_family = $lock_font
    position = $lock_footer_position
    halign = center
    valign = bottom
}
