# Main terminal appearance. The generated palette is included last, so pywal
# supplies colors while font, spacing and opacity always stay under your control.
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
window_padding_width 18
background_opacity 0.86
dynamic_background_opacity yes
# Do not restore a saved maximized state over Hyprland's tiled windows.
remember_window_size no
initial_window_width 100c
initial_window_height 28c
confirm_os_window_close -1

# Still cursor and immediate scrolling match the rest of this minimal desktop.
cursor_shape beam
cursor_blink_interval 0
cursor_trail 0
# Keep shell integration from overriding the steady beam with a blinking cursor.
shell_integration enabled no-cursor
# Apply the compositor's tiled dimensions promptly instead of waiting 100 ms.
resize_debounce_time 0.01 0.05
wheel_scroll_multiplier 3.0
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0
touch_scroll_multiplier 1.0

# Tabs appear only when needed; keep their decoration quiet.
tab_bar_min_tabs 2
tab_bar_style separator
tab_separator "   "
tab_title_template "{index}: {title}"
active_tab_font_style bold
inactive_tab_font_style normal

# Zsh is scoped to Kitty, preserving Bash login and Hyprland startup behavior.
shell ${HOME}/.config/hypr/scripts/kitty-shell
env ZDOTDIR=${HOME}/.config/hypr/terminal/zsh
env STARSHIP_CONFIG=${HOME}/.config/hypr/terminal/starship.toml

# Fallback colors also make a first launch work before palette generation.
include colors.conf
