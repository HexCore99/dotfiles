# Application launcher only. The global Fuzzel config still serves clipboard
# history and other dmenu users. Open this theme through scripts/launcher.
[main]
font=Noto Sans:size=13
terminal=foot -e
dpi-aware=no
anchor=center
layer=overlay
prompt="› "
placeholder=Search applications…
icons-enabled=yes
icon-theme=Papirus-Dark
# Keep the list compact; width is measured in font character cells, not pixels.
width=38
lines=8
# Fuzzel's row height is in points: 30 pt gives 40 px at the unscaled 96 DPI.
line-height=30
horizontal-pad=22
vertical-pad=20
inner-pad=14
image-size-ratio=0
match-counter=yes

# Eight-digit RGBA. f2 is about 95% background opacity.
[colors]
background=1b1c22f2
text=f1f1f5ff
input=f1f1f5ff
prompt=8ab4ffff
placeholder=999aa7ff
match=8ab4ffff
selection=30313cff
selection-text=f1f1f5ff
selection-match=8ab4ffff
counter=999aa7ff
border=424544ff

[border]
width=1
radius=24
selection-radius=10
